# Publica el sitio en GitHub Pages en cada push a "main",
# y además una vez por semana para refrescar los datos de tus repos.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 11 * * 1' # lunes 6:17 a. m. hora Colombia
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Permite leer la API de GitHub sin toparse con el límite de uso.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
